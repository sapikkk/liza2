<!-- GALERI PEMENANG PETANI JUARA v3 — tempel ke Wix: Add > Embed Code > Embed HTML (Code). Ganti SELURUH kode lama, lalu Publish. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
.pj{--pj-green:#007200;--pj-green-dark:#005f00;--pj-green-tint:#e5f3e6;--pj-gold:#e5be02;--pj-ink:#1f1f1f;--pj-muted:#5a5a5a;--pj-line:#d9d9d9;
  box-sizing:border-box;max-width:1100px;margin:0 auto;padding:48px 20px;font-family:'Inter',system-ui,sans-serif;color:var(--pj-ink);line-height:1.5}
.pj *{box-sizing:border-box}
.pj-head{text-align:center;max-width:640px;margin:0 auto 36px}
.pj-eyebrow{display:block;color:var(--pj-green);font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}
.pj-title{margin:0;font-size:clamp(26px,4vw,36px);font-weight:800;color:var(--pj-ink);line-height:1.15}
.pj-sub{margin:10px 0 0;color:var(--pj-muted);font-size:16px}
.pj-grid{display:grid;gap:20px;margin-top:28px}
.pj-winners{grid-template-columns:repeat(3,1fr)}
.pj-videos{grid-template-columns:repeat(3,1fr)}
.pj-fig{margin:0}
.pj-frame{position:relative;overflow:hidden;border:1px solid var(--pj-line);border-radius:24px;background:var(--pj-green-tint)}
.pj-photo{aspect-ratio:4/5}
.pj-video{aspect-ratio:16/9;background:#0b2d0b}
.pj-frame img{object-position:center 20%}
.pj-frame img,.pj-frame iframe,.pj-frame video{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover}
.pj-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--pj-muted);font-size:14px;font-weight:500;text-align:center;padding:12px}
.pj-video .pj-empty{color:#cfe6d3}
.pj-badge{position:absolute;top:12px;left:12px;z-index:1;background:var(--pj-gold);color:var(--pj-ink);font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px}
.pj-cap{display:grid;gap:2px;margin-top:12px}
.pj-cap b{font-size:16px;color:var(--pj-ink)}
.pj-cap span{font-size:14px;color:var(--pj-muted)}
/* Mobile: foto 1 & 2 berdampingan, foto 3 selebar layar dengan rasio sama seperti video */
@media (max-width:700px){
  .pj{padding:36px 16px}
  .pj-winners{grid-template-columns:repeat(2,1fr);gap:12px}
  .pj-winners .pj-fig:nth-child(3){grid-column:1/-1}
  .pj-winners .pj-fig:nth-child(3) .pj-photo{aspect-ratio:16/9}
  .pj-videos{grid-template-columns:1fr}
  .pj-badge{top:8px;left:8px;font-size:11px;padding:5px 10px}
}
@media (min-width:701px) and (max-width:900px){
  .pj-videos{grid-template-columns:repeat(2,1fr)}
}
</style>
<section class="pj" id="galeri-pemenang">
  <div class="pj-head">
    <span class="pj-eyebrow">Galeri pemenang</span>
    <h2 class="pj-title">Kenalan dengan Petani Juara</h2>
    <p class="pj-sub">Kawan Sawit yang sudah menang challenge mingguan.</p>
  </div>
  <div class="pj-grid pj-winners" id="pj-winners"></div>
  <div class="pj-grid pj-videos" id="pj-videos"></div>
</section>

<script>
/* ===== DATA PEMENANG — tambah satu blok per pemenang =====
   photo : URL gambar. Boleh format wix:image://... atau https://static.wixstatic.com/media/...
           Kosongkan jika belum ada.
   name, meta, week : opsional (nama, "Kabupaten, Provinsi", label seperti "Minggu 1") */
var WINNERS = [
  { photo: 'https://static.wixstatic.com/media/10776c_0e108c56e8844696937443b1a6259406~mv2.jpeg' },
  { photo: 'https://static.wixstatic.com/media/10776c_ecf559f7edf14f118d87fa3c995d7f4e~mv2.jpeg' },
  { photo: 'https://static.wixstatic.com/media/10776c_abdcc3b209f0498fa8715d2668bd915d~mv2.jpeg' }
];

/* ===== DATA VIDEO =====
   type: 'youtube' (isi id) | 'mp4' (isi url, thumb) | 'embed' (isi url embed, mis. TikTok/IG)
   Contoh:
   { type:'youtube', id:'dQw4w9WgXcQ', title:'Pak Budi, Kampar', meta:'Pemenang Minggu 3' }
   { type:'mp4', url:'https://.../video.mp4', thumb:'https://.../thumb.jpg', title:'...', meta:'...' }
   { type:'embed', url:'https://www.tiktok.com/embed/v2/7xxxxxxxxxxxx', title:'...', meta:'...' } */
var VIDEOS = [
  { type: 'mp4', url: 'https://video.wixstatic.com/video/10776c_125615e0874b46ba8633bcbebee93908/720p/mp4/file.mp4', title: 'Vifco', meta: 'Pemenang Petani Juara' },
  { type: 'mp4', url: 'https://video.wixstatic.com/video/10776c_1e04d28e4c314494849d09fa34a55cb5/720p/mp4/file.mp4', title: 'Aris', meta: 'Pemenang Petani Juara' },
  { type: 'mp4', url: 'https://video.wixstatic.com/video/10776c_489545e3cac34f48baebddab64652cb6/720p/mp4/file.mp4', title: 'Sayid', meta: 'Pemenang Petani Juara' }
];

/* ===== RENDER — tidak perlu diubah ===== */
(function () {
  /* Bersihkan backslash sisa salin-tempel (mis. 10776c\_abc jadi 10776c_abc) dan spasi */
  function clean(s) { return String(s == null ? '' : s).replace(/\\/g, '').trim(); }
  function img(src) {
    src = clean(src);
    if (!src) return '';
    var m = src.match(/^wix:image:\/\/v1\/([^\/#]+)/);
    return m ? 'https://static.wixstatic.com/media/' + m[1] : src;
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  /* Jika type kosong, tebak dari isi data */
  function kind(v) {
    if (v.type) return v.type;
    if (v.id) return 'youtube';
    var u = clean(v.url);
    if (!u) return '';
    return (/\.(mp4|webm|mov)([?#]|$)/i.test(u) || /video\.wixstatic\.com/.test(u)) ? 'mp4' : 'embed';
  }

  var wBox = document.getElementById('pj-winners');
  WINNERS.forEach(function (w, i) {
    var fig = document.createElement('figure');
    fig.className = 'pj-fig';
    var label = w.name || 'Pemenang Petani Juara ' + (i + 1);
    var cap = (w.name || w.meta)
      ? '<figcaption class="pj-cap">' + (w.name ? '<b>' + esc(w.name) + '</b>' : '') + (w.meta ? '<span>' + esc(w.meta) + '</span>' : '') + '</figcaption>'
      : '';
    fig.innerHTML = '<div class="pj-frame pj-photo"><span class="pj-badge">' + esc(w.week || 'Pemenang ' + (i + 1)) + '</span></div>' + cap;
    var frame = fig.firstChild;
    var src = img(w.photo);
    function placeholder() {
      var p = document.createElement('div');
      p.className = 'pj-empty';
      p.textContent = 'Foto belum tersedia';
      frame.appendChild(p);
    }
    if (src) {
      var im = new Image();
      im.alt = label;
      im.loading = 'lazy';
      im.referrerPolicy = 'no-referrer';
      im.onerror = function () { im.remove(); placeholder(); };
      im.src = src;
      frame.insertBefore(im, frame.firstChild);
    } else {
      placeholder();
    }
    wBox.appendChild(fig);
  });
  var vBox = document.getElementById('pj-videos');
  VIDEOS.forEach(function (v) {
    var k = kind(v), url = clean(v.url), inner;
    if (k === 'youtube' && v.id) {
      inner = '<iframe src="https://www.youtube-nocookie.com/embed/' + encodeURIComponent(clean(v.id)) + '" title="' + esc(v.title) + '" loading="lazy" allowfullscreen allow="accelerometer; encrypted-media; picture-in-picture"></iframe>';
    } else if (k === 'embed' && url) {
      inner = '<iframe src="' + esc(url) + '" title="' + esc(v.title) + '" loading="lazy" allowfullscreen></iframe>';
    } else if (k === 'mp4' && url) {
      inner = '<video controls preload="metadata" playsinline src="' + esc(url) + '#t=0.1"' + (v.thumb ? ' poster="' + esc(img(v.thumb)) + '"' : '') + '></video>';
    } else {
      inner = '<div class="pj-empty">Video segera hadir</div>';
    }
    var fig = document.createElement('figure');
    fig.className = 'pj-fig';
    fig.innerHTML = '<div class="pj-frame pj-video">' + inner + '</div><figcaption class="pj-cap"><b>' + esc(v.title) + '</b><span>' + esc(v.meta) + '</span></figcaption>';
    var vid = fig.querySelector('video');
    if (vid) {
      /* Jika video gagal dimuat, tampilkan tautan agar tetap bisa ditonton */
      vid.addEventListener('error', function () {
        var f = vid.parentNode;
        vid.remove();
        var d = document.createElement('div');
        d.className = 'pj-empty';
        d.innerHTML = '<a href="' + esc(url) + '" target="_blank" rel="noopener" style="color:#fff;font-weight:600">Tonton video</a>';
        f.appendChild(d);
      }, true);
    }
    vBox.appendChild(fig);
  });
})();
</script>
